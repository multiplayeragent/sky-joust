<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Joust</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #140c2a; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; }
  #cards { top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 0 8px; }
  .pc { min-width: 64px; padding: 3px 8px 5px; border-radius: 10px; background: #0007; border-bottom: 3px solid var(--c); text-align: center; font-size: 11px; font-weight: 700; }
  .pc small { display: block; max-width: 86px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
  .pc i { display: inline-block; width: 8px; height: 8px; margin: 3px 1px 0; border-radius: 50%; background: #ffffff30; } .pc i.on { background: #ffd166; }
  .pc.out { opacity: .4; } .pc.me small { color: #ffd166; } .pc .st { font-size: 10px; opacity: .8; }
  #msg { top: 32%; left: 0; right: 0; text-align: center; font: 900 54px/1 system-ui, sans-serif; color: #ffd166; -webkit-text-stroke: 2px #4a1d00; padding: 0 10px; }
  #msg small { display: block; margin-top: 8px; font-size: 17px; color: #fff; -webkit-text-stroke: 0; }
  #hint { top: calc(max(8px, env(safe-area-inset-top)) + 62px); left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; padding: 0 12px; transition: opacity .8s; }
  #net { bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .75; }
  #toast { top: 22%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 900; color: #fff; transition: opacity .4s; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b061ab0; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #2a1d4f; border: 1px solid #ffffff2e; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 28px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #ff9f6b; text-align: left; text-transform: uppercase; letter-spacing: .06em; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; min-height: 30px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd166; font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffd166; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 20px); touch-action: none; display: flex; gap: 12px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #ffffff66; background: #ffffff1c; color: #fff; font: 800 16px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #padL { left: max(12px, env(safe-area-inset-left)); } #padR { right: max(12px, env(safe-area-inset-right)); }
  #padR button { width: 96px; height: 96px; background: #ff9f6b44; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="cards"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="padL" hidden><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="padR" hidden><button data-k="flap">FLAP</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>This match</h3><ol id="results"></ol>
  <h3>Most matches won</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ SKY JOUST · a Multiplayer Agent starter ═════════════════════════════════════════
 * Flap higher. Lance lower knights. Grab their eggs. Versus, 2–6 players; bots fill
 * empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ rounds, flapping, speeds, eggs, lava, bots
 *   ARENA ......... the ledges, the lava, the grabbing hand (where it rises, from the round seed)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   KNIGHTS ....... flying, landing, wrapping around the sides, eggs (the same code for people and bots)
 *   MATCH (HOST) .. countdown, rounds, who is still in, round wins, the winner, the bots. Only the host writes these.
 *   ME ............ my controls, my crashes, my egg. Each player writes only its own.
 *   DRAW .......... sky, castles, ledges, lava and hand, birds and riders, eggs, sparks
 *   HUD & RESULTS . round pips, banners, the results card, leaderboard
 *   INPUT ......... keyboard, and touch buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `k` (one JSON field: position, speed, facing,
 *     state ride|egg|out, the round it's for, flapping, blinking) about 15 times a second,
 *     `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - Crashes are decided by the pair, and the LOWER one calls it: when my knight touches
 *     another and my lance is lower, I lose: I turn into an egg and send "unhorsed"
 *     {by, n, x, y}. Level lances just bounce. When someone touches my egg, I'm out; the
 *     lava and its hand are my own call too. The host does all this for its bots.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` {id, v, ph:
 *     intro|fight|round|over, rd, at, startAt, endsAt, ids, names, wins, ko, un, rw, w}
 *     and `bots`. It reads everyone's state to see who is still in, ends the round when
 *     one knight is left, and starts the next. Someone who joins takes a bot's seat next round.
 *   - The hand in the lava rises at spots picked from the round number (mulberry32), so
 *     every screen sees it in the same place.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "joust-wins": +1 for every match you win, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  rounds: 5,            // round wins needed to win the match
  seats: 4,             // bots fill the match up to this many knights
  introMs: 2500,        // countdown before the first round
  nextMs: 1500,         // countdown before every later round
  roundMs: 45000,       // a round ends after this, even with several knights left
  bannerMs: 2600,       // ms the "X wins the round" banner shows
  resultsMs: 11000,     // ms the results show before the next match
  gravity: 900,         // px/s² (the arena is 960 × 600)
  flap: 320,            // px/s one flap adds upward
  maxRise: 430,         // px/s fastest climb
  maxFall: 520,         // px/s fastest fall
  accel: 520,           // px/s² steering
  maxSpeed: 250,        // px/s
  level: 6,             // lances within this many px of each other just bounce
  hatchMs: 5000,        // an egg nobody grabs hatches after this
  invMs: 1500,          // ms a hatched knight can't be unhorsed
  startSafeMs: 2000,    // ms nobody can be unhorsed when a round starts
  lavaY: 560,           // the lava's surface
  handEvery: 5000,      // the hand rises once every this many ms ...
  handReach: 100,       // ... this high out of the lava
  botFlap: [0.13, 0.3], // seconds between a bot's flaps (when it wants to climb)
  board: "joust-wins",  // leaderboard name
};
const BOT_NAMES = ["Sir Pecks", "Dame Feather", "Sir Gust", "Lady Talon", "Sir Plume", "Dame Squawk"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd166", "#06d6a0", "#c77dff", "#ff9f1c"];

// ── ARENA ───────────────────────────────────────────────────────────────────────────
// World px; y grows downward; x wraps around (fly off the right, come back on the left).
const AW = 960, AH = 600, KW = 44, KH = 40;
const LEDGES = [
  { x1: 0, x2: 230, y: 520 }, { x1: 730, x2: 960, y: 520 }, // the ground at the edges (they join across the wrap)
  { x1: 380, x2: 580, y: 420 },
  { x1: 100, x2: 280, y: 300 }, { x1: 680, x2: 860, y: 300 },
  { x1: 400, x2: 560, y: 185 },
  { x1: 0, x2: 110, y: 140 }, { x1: 850, x2: 960, y: 140 },
];
const SPAWNS = [[115, 520], [845, 520], [190, 300], [770, 300], [480, 420], [480, 185]];
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** The lava hand right now: { x, h (how far up) } or null. The same on every screen: picked from the round and time. */
function handNow(m) {
  if (!m || m.ph !== "fight") return null;
  const since = Date.now() - m.startAt; if (since < 0) return null;
  const k = Math.floor(since / CONFIG.handEvery), into = (since % CONFIG.handEvery) / CONFIG.handEvery;
  if (into < 0.3 || into > 0.75) return null;
  const x = 270 + mulberry32(m.id * 7919 + m.rd * 131 + k)() * 420; // over the open lava between the ground ledges
  return { x, h: CONFIG.handReach * Math.sin(((into - 0.3) / 0.45) * Math.PI) };
}
const wrapX = (x) => ((x % AW) + AW) % AW;
const dxWrap = (a, b) => { let d = b - a; if (d > AW / 2) d -= AW; if (d < -AW / 2) d += AW; return d; };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'sky-joust',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 6, rounds: 3, introMs: 400, nextMs: 400, bannerMs: 900, resultsMs: 1200, hatchMs: 3500, handEvery: 3500, startSafeMs: 600 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v ?? fallback;
  const v = parse(raw, null); parsed.set(key, { raw, v }); return v ?? fallback;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── KNIGHTS ─────────────────────────────────────────────────────────────────────────
// A knight: { id, name, color, x, y (feet), vx, vy, f (facing), ground, s (0 ride, 1 egg, 2 out), flapT, inv, hatchAt, unN }
const RIDE = 0, EGG = 1, OUT = 2;
function newKnight(id, name, color) { return { id, name, color, x: 480, y: 300, vx: 0, vy: 0, f: 1, ground: false, s: OUT, flapT: 0, inv: 0, hatchAt: 0, unN: 0, key: "" }; }
/** One physics step for a rider. ctl = { x: -1..1, flap (pressed this frame) }. */
function fly(k, ctl, dt) {
  k.flapT = Math.max(0, k.flapT - dt);
  if (ctl.flap) { k.vy = Math.max(Math.min(k.vy, 120) - CONFIG.flap, -CONFIG.maxRise); k.flapT = 0.28; k.ground = false; }
  if (ctl.x) { k.f = Math.sign(ctl.x); k.vx += ctl.x * CONFIG.accel * (k.ground ? 1.4 : 1) * dt; }
  else k.vx *= Math.pow(k.ground ? 0.05 : 0.6, dt);
  k.vx = Math.max(-CONFIG.maxSpeed, Math.min(CONFIG.maxSpeed, k.vx));
  move(k, dt, 0);
}
/** Gravity, the ceiling, the ledges (land on top, bump from below), wrapping at the sides. `bounce` for eggs. */
function move(k, dt, bounce) {
  if (!k.ground) k.vy = Math.min(CONFIG.maxFall, k.vy + CONFIG.gravity * dt);
  const oldY = k.y;
  k.x = wrapX(k.x + k.vx * dt); k.y += k.vy * dt;
  if (k.y - KH < 0) { k.y = KH; k.vy = Math.abs(k.vy) * 0.3; }
  const on = (p) => k.x > p.x1 - 12 && k.x < p.x2 + 12;
  if (k.ground && !LEDGES.some((p) => on(p) && Math.abs(k.y - p.y) < 1)) k.ground = false; // walked off the edge
  for (const p of LEDGES) {
    if (!on(p)) continue;
    if (k.vy >= 0 && oldY <= p.y + 0.5 && k.y >= p.y) {
      k.y = p.y;
      if (bounce && k.vy > 140) k.vy = -k.vy * bounce; else { k.vy = 0; k.ground = true; }
    } else if (k.vy < 0 && oldY - KH * (bounce ? 0.4 : 1) >= p.y + 14 && k.y - KH * (bounce ? 0.4 : 1) < p.y + 14) { k.y = p.y + 14 + KH * (bounce ? 0.4 : 1); k.vy = 60; } // bump the ledge from below
  }
}
const inLava = (k) => k.y > CONFIG.lavaY + 6;
const grabbedByHand = (k, m) => { const h = handNow(m); return !!h && !k.ground && Math.abs(dxWrap(k.x, h.x)) < 30 && k.y > CONFIG.lavaY - h.h + 10; };
/** Do two riders crash? */
const crash = (a, b) => Math.abs(dxWrap(a.x, b.x)) < KW - 6 && Math.abs(a.y - b.y) < KH - 6;
/** Turn a rider into an egg where it was. */
function toEgg(k) { k.s = EGG; k.vy = -180; k.vx *= 0.4; k.ground = false; k.hatchAt = Date.now() + CONFIG.hatchMs; }
function hatch(k) { k.s = RIDE; k.vy = -260; k.ground = false; k.inv = Date.now() + CONFIG.invMs; }

/** The bot brain: climb above the nearest rider and dive on it; grab eggs; stay out of the lava. */
function botControl(b, all, t) {
  const ctl = { x: 0, flap: false };
  const foes = all.filter((o) => o.id !== b.id && o.s !== OUT);
  const egg = foes.filter((o) => o.s === EGG).sort((p, q) => Math.abs(dxWrap(b.x, p.x)) - Math.abs(dxWrap(b.x, q.x)))[0];
  const riders = foes.filter((o) => o.s === RIDE);
  const tg = egg && Math.abs(dxWrap(b.x, egg.x)) < 320 ? egg : riders.sort((p, q) => Math.abs(dxWrap(b.x, p.x)) + Math.abs(p.y - b.y) - Math.abs(dxWrap(b.x, q.x)) - Math.abs(q.y - b.y))[0];
  let wantY = 260;
  if (tg) {
    const dx = dxWrap(b.x, tg.x);
    ctl.x = Math.abs(dx) > 14 ? Math.sign(dx) : 0;
    const above = b.y < tg.y - 8;
    wantY = tg.s === EGG ? tg.y - 4 : Math.abs(dx) < 120 ? (above ? tg.y + 12 : tg.y - 60) : tg.y - 40; // get above it, then dive onto it
    wantY = Math.max(wantY, Math.abs(dx) < 160 ? 52 + (b.id.charCodeAt(1) % 5) * 8 : 150); // only climb to the very top when someone is close
    if (riders.some((o) => o !== tg && Math.abs(dxWrap(b.x, o.x)) < 90 && o.y < b.y - 4 && o.y > b.y - 80)) wantY = Math.min(wantY, b.y - 70); // someone above me close by: climb
  }
  wantY = Math.min(wantY, CONFIG.lavaY - 70);
  const ledge = LEDGES.find((p) => b.x > p.x1 - 20 && b.x < p.x2 + 20 && (wantY < b.y - 20 ? p.y < b.y - KH + 4 && p.y > wantY - KH : wantY > b.y + 20 && p.y >= b.y && p.y < wantY));
  if (ledge) ctl.x = b.x - ledge.x1 < ledge.x2 - b.x ? -1 : 1; // a ledge in the way up or down: go around its nearer end
  if (b.y > wantY && t > (b.flapAt || 0)) { ctl.flap = true; b.flapAt = t + (CONFIG.botFlap[0] + Math.random() * (CONFIG.botFlap[1] - CONFIG.botFlap[0])) * 1000 * (b.y > CONFIG.lavaY - 90 ? 0.6 : 1); }
  if (t < (b.dazeUntil || 0)) ctl.x = 0; // a slow moment now and then: bots aren't perfect
  else if (Math.random() < 0.003) b.dazeUntil = t + 400;
  return ctl;
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, bots: new Map(), lastBots: 0, again: false };
/** The match as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function match() {
  const m = parseOnce("match", S.shared.match, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const humansHere = () => livePlayers(); // in ?attract that is just me, flown by the bot brain
const roundKey = (m) => m.id + ":" + m.rd;
function adopt() {
  host.acting = true; host.last = null; host.bots.clear();
  const now = Date.now();
  for (const b of parseOnce("bots", S.shared.bots, [])) {
    host.bots.set(b.id, Object.assign(newKnight(b.id, b.name, b.color), { x: b.x, y: b.y, vx: b.vx || 0, vy: b.vy || 0, f: b.f || 1, s: b.s ?? OUT, key: b.r || "",
      hatchAt: b.s === EGG ? now + CONFIG.hatchMs * 0.5 : 0, inv: b.iv ? now + 800 : 0, unN: b.un || 0 }));
  }
}
/** A new round: the people here take seats first, bots fill the rest. Everyone starts on a ledge. */
function newRound(m, id, rd) {
  const humans = humansHere().slice(0, 6), want = Math.max(0, CONFIG.seats - humans.length);
  while (host.bots.size > want) host.bots.delete([...host.bots.keys()].pop());
  while (host.bots.size < want) {
    const used = new Set([...host.bots.values()].map((b) => b.name)), colors = takenColors(), bid = "b" + Math.random().toString(36).slice(2, 6);
    host.bots.set(bid, newKnight(bid, BOT_NAMES.find((n) => !used.has(n)) || "Sir Bot", COLORS.find((c) => !colors.has(c) && c !== me.color) || "#ccc"));
  }
  const ids = [...humans, ...host.bots.keys()], names = { ...(m?.names || {}) };
  for (const i of ids) names[i] = nameOf(i);
  const t = Date.now(), next = { id, rd, ph: "intro", at: t, startAt: t + (rd === 1 ? CONFIG.introMs : CONFIG.nextMs), endsAt: 0, ids, names, wins: rd === 1 ? {} : m.wins, ko: {}, un: {}, rw: null, w: null };
  for (const b of host.bots.values()) placeOnSpawn(b, next);
  return next;
}
/** "unhorsed" from a victim: count it for whoever lanced it (once per victim count `n`). */
function applyUnhorsed(victim, msg) {
  const m = match();
  if (!m || m.ph !== "fight" || !msg || !(Number(msg.n) > (m.un[victim] || 0))) return;
  writeMatch({ ...m, un: { ...m.un, [victim]: Number(msg.n) }, ko: { ...m.ko, [msg.by]: (m.ko[msg.by] || 0) + 1 } });
}
/** Who is still in: ride or egg (out = lanced egg, lava, the hand, or gone from the room). */
function stateOf(id, m, live) {
  if (id === me.id) return me.key === roundKey(m) ? me.s : RIDE;
  const b = host.bots.get(id); if (b) return b.s;
  if (!live.includes(id)) return OUT;
  const k = parseOnce("k:" + id, S.entities.players?.[id]?.k, null);
  return k && k.r === roundKey(m) ? k.s : RIDE; // not caught up to this round yet: counts as in
}
function endRound(m, winner) {
  const t = Date.now(), wins = { ...m.wins };
  if (winner) wins[winner] = (wins[winner] || 0) + 1;
  const done = winner && wins[winner] >= CONFIG.rounds;
  return writeMatch({ ...m, ph: done ? "over" : "round", wins, rw: winner, w: done ? winner : null, at: t, endsAt: t + (done ? CONFIG.resultsMs : CONFIG.bannerMs) });
}
function hostTick(dt, now) {
  if (!host.acting) adopt();
  let m = match();
  const t = Date.now();
  if (!m) m = writeMatch(newRound(null, 1, 1));
  if (m.ph === "intro" && t >= m.startAt) m = writeMatch({ ...m, ph: "fight", endsAt: t + CONFIG.roundMs });
  if (m.ph === "fight") {

  ctx.restore();
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, dropped = false, toastUntil = 0;
const startedAt = performance.now();
function toast(text) { if (ATTRACT) return; $("toast").textContent = text; $("toast").style.opacity = 1; toastUntil = performance.now() + 1800; }
function hud(m) {
  const t = Date.now();
  if (performance.now() > toastUntil) $("toast").style.opacity = 0;
  const who = (id) => (id === me.id ? "You" : m.names[id] || nameOf(id));
  $("msg").innerHTML = m.ph === "intro" ? `${Math.max(1, Math.ceil((m.startAt - t) / 1000))}<small>Round ${m.rd} · first to ${CONFIG.rounds}</small>` :
    m.ph === "fight" && t - m.startAt < 700 ? "JOUST!" : m.ph === "round" ? `${m.rw ? esc(who(m.rw)) + (m.rw === me.id ? " win" : " wins") : "Nobody wins"}<small>the round</small>` : "";
  if (ATTRACT) { for (const id of ["cards", "hint", "net", "msg"]) $(id).textContent = ""; return; }
  const all = knights(m);
  $("cards").innerHTML = m.ids.map((id) => {
    const k = all.find((x) => x.id === id), s = k ? k.s : OUT, w = m.wins[id] || 0;
    return `<div class="pc ${s === OUT && m.ph === "fight" ? "out" : ""} ${id === me.id ? "me" : ""}" style="--c:${colorOf(id)}"><small>${esc(who(id))}</small>${Array.from({ length: CONFIG.rounds }, (_, i) => `<i class="${i < w ? "on" : ""}"></i>`).join("")}<div class="st">${s === EGG ? "egg!" : s === OUT && m.ph === "fight" ? "out" : ""}</div></div>`;
  }).join("");
  if (!m.ids.includes(me.id) && m.ph !== "over") $("msg").innerHTML = `<small>This round is full. You're in the next one!</small>`;
  else if (me.s === OUT && m.ph === "fight") $("msg").innerHTML = `<small>You're out this round. Watch the rest!</small>`;
  else if (me.s === EGG && m.ph === "fight") $("msg").innerHTML = `<small>You're an egg! Hatching in ${Math.max(0, Math.ceil((me.hatchAt - t) / 1000))}…</small>`;
  $("hint").style.opacity = performance.now() - startedAt < 12000 ? 1 : 0;
  $("hint").textContent = touchUI ? "Tap FLAP to fly up · ◀ ▶ to steer · hit others from ABOVE, grab their eggs, skip the lava" : "Space / Z / ↑ to flap · ← → to steer · hit others from above, grab their eggs, skip the lava";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  const showOver = m.ph === "over" && t > m.at + 1500;
  $("over").hidden = !showOver;
  if (showOver) {
    $("overTitle").textContent = m.w === me.id ? "You win the match!" : m.w ? `${m.names[m.w] || nameOf(m.w)} wins the match!` : "It's a draw";
    $("overSub").textContent = `First to ${CONFIG.rounds} rounds`;
    const ids = Object.keys(m.wins).concat(m.ids.filter((id) => !(id in m.wins))).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => (m.wins[b] || 0) - (m.wins[a] || 0));
    $("results").innerHTML = ids.map((id) => `<li class="${id === me.id ? "me" : ""}">${esc(id === me.id ? myName : m.names[id] || nameOf(id))}<span>${m.wins[id] || 0} rounds</span></li>`).join("");
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - t) / 1000))}s`;
    if (me.shownFor !== m.id) { me.shownFor = m.id; showBoard(m.w === me.id); }
  }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { flap: [180, 90, 0.08, 0.04, "triangle"], clang: [900, 300, 0.18, 0.08, "square"], crack: [500, 120, 0.2, 0.1, "sawtooth"], sizzle: [300, 40, 0.6, 0.12, "sawtooth"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
const wake = () => { if (!audio) { try { audio = new AudioContext(); } catch {} } };
addEventListener("keydown", (e) => {
  wake(); const k = e.key.toLowerCase();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  if ([" ", "z", "arrowup", "w", "k"].includes(k) && !e.repeat) flapPressed = true;
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
for (const b of document.querySelectorAll(".pad button")) {
  const k = "pad:" + b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); b.setPointerCapture(e.pointerId); keys.add(k); if (k === "pad:flap") { flapPressed = true; holdFlapAt = performance.now() + 230; } b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { keys.delete(k); b.classList.remove("on"); });
}
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.acting = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the match meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const m = match();
  syncViews(dt, m);
  if (m) myTick(dt, m);
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; if (p.life <= 0) sparks.splice(i, 1); }
  draw(m, now / 1000);
  if (m && now - lastHud > 120) { lastHud = now; hud(m); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("unhorsed", (msg, from) => {
    if (!msg) return;
    const victim = typeof msg.v === "string" ? msg.v : from; // a bot's fall comes from the host with v = the bot
    if (host.acting && isHost() && !msg.v) applyUnhorsed(victim, msg);
    onUnhorsed(victim, msg);
  });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
